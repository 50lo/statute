# Run from the Actions tab: bumps the version, tags it on main, builds binaries
# and publishes a GitHub release whose notes are the CHANGELOG "Unreleased" section.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase
        type: choice
        options: [patch, minor, major]
        default: minor

concurrency: release

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute version
        id: version
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $current -> $version"

      - name: Update version and changelog
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=$(awk '/^## Unreleased/ {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has nothing under ## Unreleased"
            exit 1
          fi
          sed -i "0,/^version = \"$CURRENT\"$/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$VERSION\"/" \
            plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json
          sed -i "s/^## Unreleased$/## Unreleased\n\n## $VERSION - $(date -u +%F)/" CHANGELOG.md
          cargo update --workspace

      - name: Test
        run: cargo test --locked

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin main "v$VERSION"

  build:
    needs: bump
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          NAME: statute-v${{ needs.bump.outputs.version }}-${{ matrix.target }}
        run: |
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/statute" LICENSE README.md "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: statute-*.tar.gz*

  release:
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          awk -v v="## $VERSION " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" dist/* --title "v$VERSION" --notes-file notes.md
