[package]
name = "statute-cli"
version = "0.1.0"
edition = "2024"
description = "Keeps a product's rules written down, linked to code, and checked on every change"
license = "MIT"
repository = "https://github.com/50lo/statute"
homepage = "https://github.com/50lo/statute"
readme = "README.md"
keywords = ["rules", "cli", "agents"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "src/**",
    "tests/**",
    "plugin/**",
    "docs/Architecture.md",
    "docs/One-pager.md",
    "docs/Statute-spec.md",
    "AGENTS.md",
    "Cargo.toml",
    "Cargo.lock",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
]

[lib]
name = "statute"

[[bin]]
name = "statute"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
jiff = "0.2.38"
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tree-sitter = "=0.27.1"
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
yaml_serde = "0.10.7"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# `cargo release minor --execute` (or patch, major) bumps the version, dates the
# changelog, commits, tags vX.Y.Z and pushes; the tag starts the dist release workflow.
[package.metadata.release]
publish = false
pre-release-commit-message = "Release v{{version}}"
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## Unreleased", replace = "## Unreleased\n\n## {{version}} - {{date}}", exactly = 1 },
    { file = "plugin/.claude-plugin/plugin.json", search = "\"version\": \"[^\"]+\"", replace = "\"version\": \"{{version}}\"", exactly = 1 },
    { file = "plugin/.codex-plugin/plugin.json", search = "\"version\": \"[^\"]+\"", replace = "\"version\": \"{{version}}\"", exactly = 1 },
]
