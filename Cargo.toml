[package]
name = "statute"
version = "0.1.0"
edition = "2024"
description = "Keeps a product's rules written down, linked to code, and checked on every change"
license = "MIT"
publish = false

[[bin]]
name = "statute"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
yaml_serde = "0.10.7"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"
