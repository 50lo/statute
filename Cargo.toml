[package]
name = "statute"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Keep a product's rules written down, linked to code, and checked on every change"
license = "MIT"
repository = "https://github.com/50lo/statute"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
serde_json = "1"
